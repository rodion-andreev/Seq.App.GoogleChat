name: Release to NuGet

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write # nuget.org Trusted Publishing exchanges the GitHub OIDC token for a one-hour API key

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The version-bump commit pushed by this job must not start another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version & update changelog
        id: version
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          npx --yes standard-version@9.5.0
          new_version=$(node -p "require('./package.json').version")
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Build & Pack
        run: |
          dotnet pack src/Seq.App.GoogleChat/Seq.App.GoogleChat.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: a version that already exists on nuget.org must fail the release, not pass silently.
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Push version commit
        run: git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
